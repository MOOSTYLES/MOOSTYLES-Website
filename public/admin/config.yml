backend:
  name: github
  repo: MOOSTYLES/MOOSTYLES-Website
  branch: master
  base_url: https://moostyle-cms-auth.dencypher01.workers.dev
  auth_endpoint: auth

publish_mode: editorial_workflow
site_url: https://moostyles.com
display_url: https://moostyles.com


media_folder: "public/projects"
public_folder: "/projects"

collections:
  - name: mods
    label: "Mods"
    label_singular: "Mod"
    description: "Add or edit a mod. It appears on the live mod list as soon as you publish."
    folder: "src/content/mods"
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: name
    extension: json
    format: json
    summary: "{{name}}"
    sortable_fields: ["name", "slug"]
    fields:
      # --- The essentials: what visitors will actually see ---
      - label: "Mod Name"
        name: name
        widget: string

      - label: "URL Slug"
        name: slug
        widget: string
        pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "Lowercase letters, numbers, and dashes only."]
        hint: "The page address: moostyles.com/mods/your-slug. Pick it once — avoid changing it later."

      - label: "Media"
        name: media
        widget: object
        fields:
          - label: "Banner Image"
            name: banner
            widget: image
            media_folder: "/public/projects/Mods/{{slug}}"
            public_folder: "/projects/Mods/{{slug}}"
            hint: "The main thumbnail, shown on the mod list and at the top of the page."
          - label: "Preview Images"
            name: previews
            widget: list
            required: false
            field:
              label: "Image"
              name: image
              widget: image
              media_folder: "/public/projects/Mods/{{slug}}"
              public_folder: "/projects/Mods/{{slug}}"
          - label: "Screenshots"
            name: screenshots
            widget: list
            required: false
            field:
              label: "Image"
              name: image
              widget: image
              media_folder: "/public/projects/Mods/{{slug}}"
              public_folder: "/projects/Mods/{{slug}}"

      - label: "Description"
        name: description
        widget: text

      - label: "Highlights"
        name: highlights
        widget: list
        required: false
        collapsed: true
        field: { label: "Highlight", name: item, widget: string }
        hint: "Optional short bullet points, e.g. 'Comes in 4 colors'."

      - label: "Download Links"
        name: downloadOptions
        widget: object
        fields:
          - label: "Public Release"
            name: public
            widget: object
            required: false
            fields:
              - label: "CurseForge / Public URL"
                name: url
                widget: string
                required: false
              - label: "Public Release Date"
                name: date
                widget: datetime
                required: false
                hint: "Leave blank to go public immediately. Set a future date to hold it back until then."
          - label: "Patreon URL"
            name: patreonUrl
            widget: string
            required: false

      - label: "Files Included"
        name: fileManifest
        widget: list
        required: true
        min: 1
        # Start every new mod with one blank item: its required subfields block
        # saving until filled in. The site build fails on an empty list.
        default:
          - filename: ""
            description: ""
        summary: "{{fields.filename}}"
        hint: "What's in the download — at least one entry is required, or the site won't build."
        fields:
          - label: "File / Item Name"
            name: filename
            widget: string
          - label: "Description"
            name: description
            widget: text

      # --- Extra details (optional — most mods won't need to touch these) ---
      - label: "Collection / Brand"
        name: collection
        widget: string
        required: false
        hint: "Leave blank for a standalone mod. Fill in to group several mods under one brand (e.g. MOCA)."

      - label: "Tags"
        name: tags
        widget: list
        required: false
        collapsed: true
        field: { label: "Tag", name: item, widget: string }

      - label: "Known Issues"
        name: knownIssues
        widget: list
        required: false
        collapsed: true
        field: { label: "Issue", name: item, widget: string }

      - label: "Installation Notes"
        name: installation
        widget: list
        required: false
        collapsed: true
        field: { label: "Paragraph", name: item, widget: text }

      - label: "File Types"
        name: fileTypes
        widget: list
        collapsed: true
        default: ["inZOI Mod File"]
        field: { label: "File Type", name: item, widget: string }

      - label: "Status"
        name: status
        widget: object
        collapsed: true
        fields:
          - label: "Compatibility"
            name: compatibility
            widget: select
            options: ["untested", "compatible", "needs-update", "broken"]
            default: "untested"
          - label: "Game Version"
            name: gameVersion
            widget: string
            default: "inZOI"

      - label: "Internal ID"
        name: legacyId
        widget: string
        required: false
        hint: "Optional — a short code for your own reference (e.g. MOD-042). Not shown to visitors. Safe to leave blank."

      - label: "Flags"
        name: legacy
        widget: object
        collapsed: true
        fields:
          - label: "Archive Item (old/retired mod)"
            name: isArchiveItem
            widget: boolean
            default: false
          - label: "Mark as New"
            name: isNew
            widget: boolean
            default: true
